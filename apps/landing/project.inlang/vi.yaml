skillDetail_contract_note: "Định danh artifact và điều kiện hoàn thành từ định nghĩa catalog; không phải chính sách thực thi hay phê duyệt."

hero_chat_path: "ChatGPT và chat client hỗ trợ MCP · nghiên cứu, kế hoạch, nghiệp vụ và QA"
hero_dev_path: "Cursor, Claude Code, Codex, Copilot · workflow kỹ thuật theo repo"
home_catalog_chat_hint: "13 skill pack từ xa qua MCP. Tên như /research là định danh skill, không phải lệnh bắt buộc phải gõ. Trong AI chat tương thích đã kết nối, hãy mô tả mục tiêu tự nhiên; cách gọi và quyền truy cập tùy client."
home_catalog_dev_hint: "Cài skill cục bộ cho coding agent, mở repo và tuân thủ cách gọi của client. Tên có dấu / là định danh workflow; cú pháp dùng thực tế tùy công cụ."
skill_audience_both: "Chat (MCP) · Development (cục bộ)"
skill_audience_dev: "Development tools · cục bộ"
skill_audience_title: "Dùng skill ở đâu"
skill_audience_both_detail: "Có trong catalog work pack qua remote MCP ở chat client tương thích và dưới dạng skill cục bộ ở công cụ phát triển tương thích. Chat không cần checkout repo. Thao tác phụ thuộc công cụ và quyền rõ ràng; quy tắc gọi thủ công vẫn áp dụng."
skill_audience_dev_detail: "Cài cục bộ vào công cụ phát triển tương thích như Cursor, Claude Code, Codex hoặc Copilot. Skill này không nằm trong catalog work pack remote MCP đã công bố."
pipeline_dev_note: "Các giai đoạn chỉ là hướng dẫn tùy chọn, không phải orchestration engine của AI Kit. Người dùng chat có thể dùng workflow nghiệp vụ mà không cần checkout repo."
intelligence_eval_method: "So sánh các tác vụ giả lập tương đương khi có và không có hướng dẫn skill; chấm riêng hard gate, chất lượng đầu ra và dấu vết truy xuất. Chỉ công bố mức cải thiện khi có số liệu đo."
quickstart_choose: "Chọn công cụ AI của bạn"
quickstart_choose_body: "Kết nối work skill đã công bố với AI chat tương thích, hoặc cài skill cục bộ cho trợ lý lập trình."
quickstart_dev_title: "Cho AI development tools"
quickstart_chat_step1: "Thêm URL server trong cấu hình MCP tùy chỉnh của client (Streamable HTTP)."
quickstart_chat_step2: "Đăng nhập OAuth và bật kết nối AI Kit trong phiên."
quickstart_chat_step3: "Mô tả kết quả cần; client có thể tìm và tải work pack liên quan. Chọn workflow tường minh khi được yêu cầu."
quickstart_chat_example: "So sánh hai phương án onboarding, liệt kê đánh đổi và câu hỏi còn mở, rồi soạn đề xuất để stakeholder review. Không publish."
recipe_product_body: "Từ bằng chứng hoặc brief đã duyệt đến yêu cầu, estimate, task và QA. Dùng lại artifact đã duyệt."
recipe_bug_body: "Ghi nhận lỗi, kiểm tra trạng thái tracker và xác minh sửa lỗi chỉ khi có bằng chứng thực tế."
recipe_business_body: "So sánh phương án, phản biện giả định và truyền đạt quyết định đề xuất hoặc đã duyệt."
recipe_sprint_body: "Dùng backlog hiện tại, rà phạm vi và đề xuất kế hoạch giao việc cùng task khả thi."
recipe_release_body: "Đối chiếu phạm vi và bằng chứng QA với release gate rồi soạn thông điệp stakeholder."

# --- SDK integration ---
nav_sdk: "SDK"
sdk_hero_path: "Dành cho lập trình viên Business MCP · skill có phiên bản và cache cục bộ"
sdk_title: "Đưa AI Kit vào MCP của bạn."
sdk_intro: "Dùng chung phương pháp đặc tả, lập kế hoạch và review trong server nghiệp vụ. MCP của bạn quản lý ngữ cảnh và thao tác; AI Kit cung cấp hướng dẫn skill dùng lại."
sdk_release_note: "Cài phiên bản SDK mới nhất. Skill phát hành độc lập; SDK tự chọn phiên bản skill mới nhất theo mặc định."
sdk_feature_static: "Static bundle theo phiên bản"
sdk_feature_static_body: "Nội dung Git được pin, kiểm tra và đóng gói lúc build. Provider không cần gọi GitHub khi xử lý request."
sdk_feature_cache: "Tải một lần, dùng lại"
sdk_feature_cache_body: "Cache theo process, gộp request đồng thời và preload tùy chọn giúp tránh gọi mạng lặp lại cho nội dung đã tải."
sdk_feature_extend: "Mở rộng theo nghiệp vụ"
sdk_feature_extend_body: "Thêm quy tắc nội bộ đáng tin cậy mà không sao chép hoặc ghi đè core skill. MCP của bạn kiểm tra mọi thao tác ghi."
sdk_architecture: "Starter đã pin cần một static request khi cache lạnh; cache hit không cần gọi mạng."
sdk_install_title: "Cài SDK"
sdk_install_body: "Node.js 22 trở lên. Cài đặt qua Polyms npm registry, không cần authentication token."
sdk_setup_title: "Khởi tạo một lần mỗi process"
sdk_setup_body: "Giữ provider bên ngoài từng tool handler. Chỉ preload skill thường dùng khi cần; xử lý lỗi mạng trước khi trả workflow."
sdk_usage_title: "Dùng skill trong MCP"
sdk_reference_body: "Starter trả workflow gốc và tiêu chuẩn chung nếu áp dụng. Tải thêm reference theo đúng đường dẫn trong manifest khi cần."
sdk_methods_title: "Các hàm SDK"
sdk_method_list: "Khám phá catalog theo phiên bản."
sdk_method_get: "Tải starter, full, manifest hoặc file chọn lọc."
sdk_method_preload: "Làm nóng cache cho starter bundle."
sdk_method_clear: "Xóa catalog và nội dung đã cache."
sdk_http_title: "HTTP API"
sdk_http_body: "Dùng static JSON trực tiếp nếu không dùng SDK TypeScript; dùng POST chỉ đọc để chọn đúng đường dẫn file."
sdk_security: "Phân phối public skill không yêu cầu credential người dùng. Giữ dữ liệu nghiệp vụ và quyền ghi trong MCP của bạn; hướng dẫn skill không cấp quyền."
sdk_performance_note: "Chưa benchmark latency production. Số request mô tả thiết kế, không phải thời gian phản hồi đã đo."

