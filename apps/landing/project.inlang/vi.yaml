# --- hero ---
chip_usecases: "ứng dụng"
usecases_title: "Trang bị phương pháp làm việc cho AI của bạn."
usecases_intro: "Áp dụng phương pháp nhất quán cho nghiệp vụ hằng ngày và phát triển phần mềm có ngữ cảnh repo, ngay trong trợ lý AI quen thuộc."
usecases_research_title: "Nghiên cứu và so sánh"
usecases_research_body: "Phân tích các phương án, tách bằng chứng khỏi giả định và chuẩn bị nội dung ra quyết định."
usecases_research_outcome: "Ví dụ: hai đề xuất nhà cung cấp → bảng so sánh, thiếu sót bằng chứng và bản nháp quyết định."
usecases_reqs_title: "Biến ý tưởng thành yêu cầu"
usecases_reqs_body: "Làm rõ phạm vi và tiêu chí chấp nhận, sau đó soạn bản đặc tả để nhóm có thể review."
usecases_reqs_outcome: "Ví dụ đầu ra: yêu cầu có truy vết và danh sách câu hỏi còn mở."
usecases_delivery_title: "Lập kế hoạch, tổ chức và kiểm thử"
usecases_delivery_body: "Ước lượng effort, chia task triển khai và xây dựng phạm vi QA từ yêu cầu đã thống nhất."
usecases_delivery_outcome: "Ví dụ đầu ra: bản nháp estimate, task và test case."
usecases_engineering_title: "Phát triển phần mềm có kỷ luật"
usecases_engineering_body: "Dùng skill cục bộ trong coding assistant để hỗ trợ design, implementation, review và E2E."
usecases_engineering_outcome: "Ví dụ đầu ra: thay đổi đúng phạm vi kèm bước xác minh."
usecases_note: "AI Kit cung cấp phương pháp. Host AI chọn skill liên quan và chỉ sử dụng ngữ cảnh, công cụ mà nó được cấp quyền truy cập."
hero_badge: "AI Augmentation Layer"
hero_ctaPrimary: "Thiết lập AI Kit cho AI chat"
hero_ctaSecondary: "Khám phá skill →"
hero_line1: "Mở rộng năng lực AI"
hero_line2: "bạn đang dùng"
hero_sub: "Bổ sung skill và phương pháp làm việc có cấu trúc cho AI bạn đang dùng để nghiên cứu, viết yêu cầu nghiệp vụ, lập kế hoạch, kiểm thử và phát triển phần mềm. AI Kit cung cấp hướng dẫn; AI của bạn suy luận và thực hiện hành động được cấp quyền."

# --- positioning ---
positioning_ask_title: "Yêu cầu AI của bạn"
positioning_ask_body: "“Rà soát phạm vi release và bằng chứng QA, soạn checklist sẵn sàng phát hành và nêu các điểm còn chặn. Không publish.”"
positioning_method_title: "AI của bạn chọn hướng dẫn từ AI Kit"
positioning_method_body: "Khi client hỗ trợ, host AI chọn skill release và QA, template và các bước kiểm tra chất lượng phù hợp."
positioning_apply_title: "AI của bạn áp dụng"
positioning_apply_body: "AI của bạn kiểm tra bằng chứng được phép truy cập, đánh dấu phần chưa xác minh và soạn checklist. AI Kit không điều phối hay phê duyệt phát hành."
positioning_label: "Cách hoạt động"
positioning_title: "AI của bạn, thêm phương pháp và kiến thức."
positioning_intro: "Trong client tương thích, AI của bạn chọn và áp dụng hướng dẫn phù hợp. AI Kit cung cấp phương pháp, không phải một bộ máy thực thi riêng."
positioning_note: "AI Kit cung cấp phương pháp và tài liệu tham chiếu, không phải một model hay agent runtime mới. Memory và dữ liệu nghiệp vụ riêng vẫn thuộc hệ thống sở hữu. MCP, SDK, native skills và plugin là các cách phân phối khi được hỗ trợ."

