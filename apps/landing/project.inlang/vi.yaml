example_task3: "Thêm test tự động cho thành công, lỗi dữ liệu và truy cập không đủ quyền."
example_effort: "Effort: chưa ước lượng. Cần kiểm tra giao diện repo và ràng buộc dữ liệu trước. Đây không phải cam kết tiến độ."
