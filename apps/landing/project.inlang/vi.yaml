# --- principles ---
principles_1_body: /align thu hẹp khoảng cách giao tiếp — hỏi xoáy quyết định trước khi vào /reqs hoặc /to-prd.
principles_1_title: Thống nhất trước khi bắt đầu dựng
principles_2_body: Kết hợp theo từng việc với các kỹ năng có tên ngắn (/reqs, /design, /dev) — không cần quy trình nặng nề.
principles_2_title: Nhỏ và dễ kết hợp
principles_3_body:
  /dev đưa TDD, kiểm soát kiểu, và debug có kỷ luật vào quy trình — tín hiệu nhanh, không sinh
  code mù quáng.
principles_3_title: Vòng phản hồi
principles_4_body:
  Spec đặt tên rõ cho module và seam; kỹ năng giữ code khỏi rối thành khối bùn mà agent dễ tạo ra
  khi code nhanh.
principles_4_title: Thiết kế mỗi ngày
principles_5_body: Fork, chỉnh sửa, rồi commit lại — kỹ năng là của bạn, không phải prompt hộp đen.
principles_5_title: Tự sửa và sở hữu
