example_intro: "Ví dụ giả định về bản nháp mà AI client tương thích có thể soạn nhờ phương pháp AI Kit. Đây không phải bản ghi hoặc bằng chứng từ một lần chạy AI Kit thực tế."
example_reqs_heading: "Yêu cầu và tiêu chí chấp nhận"
