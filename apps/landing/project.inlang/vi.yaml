intelligence_discovery_title: "Tìm skill phù hợp"
intelligence_discovery_body: "Intent, ranh giới và starter paths giúp client chọn ít skill nhất cần thiết. Yêu cầu đơn giản có thể không dùng skill."
intelligence_loading_title: "Tải theo nhu cầu"
intelligence_loading_body: "Đọc workflow gốc trước. Tải template và tài liệu theo đường dẫn chính xác khi cần; tái sử dụng nội dung đã có trong phiên."
intelligence_composition_title: "Phối hợp skill"
intelligence_composition_body: "Contract đầu vào/đầu ra, ngữ cảnh chung và completion gate hướng dẫn bàn giao tùy chọn. Client dừng phần bị chặn thay vì tự bịa quyết định."
intelligence_loading_example: "Tải workflow trước, tham chiếu sau"
intelligence_loading_explain: "Ví dụ: tìm pack design rồi chỉ tải file gốc được công bố."
intelligence_loading_note: "File còn lại chỉ là metadata cho đến khi được yêu cầu."
intelligence_eval_title: "Thiết kế để kiểm chứng"
intelligence_eval_body: "Evaluation kiểm tra đầu ra có giữ đúng yêu cầu, chọn đúng skill và bàn giao đúng không. Phương pháp so sánh với baseline không dùng skill trong điều kiện tương đương."
