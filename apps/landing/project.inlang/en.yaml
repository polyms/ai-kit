# --- quickstart ---
quickstart_body: 'Install skills and the five principal agents for Cursor, Claude Code, Codex, and GitHub Copilot. Keep this checkout: the installed skills and role instructions link back to it.'
quickstart_terminalComment: 'installs all four clients; existing Codex/Copilot entries are backed up'
quickstart_titlePrefix: 'Start with'
quickstart_prerequisites: 'Before installing, have Git, Node.js, pnpm, and access to the @polyms/ui-kit package on GitHub Packages available.'
quickstart_targets: 'For one client only, replace the last command with pnpm bootstrap cursor, pnpm bootstrap claude, pnpm bootstrap codex, or pnpm bootstrap copilot. Codex/Copilot targets leave existing Cursor/Claude installations unchanged.'
quickstart_invocation: 'Restart your editor or open a new chat, then select /setup in your target project. Cursor, Claude Code, and Copilot use /name; Codex CLI/IDE uses $name or /skills. Desktop clients can use their skill picker. The /name notation throughout this site names the same workflow.'
quickstart_copilot: 'In VS Code, select the Copilot harness and open Chat: Open Customizations to check skills and the five agents. Codex and Copilot share skills in ~/.agents/skills; their agents are installed in ~/.codex/agents and ~/.copilot/agents respectively.'
quickstart_mcp: 'Configure Knowledge MCP separately in each target project. For Codex, run codex mcp add aikit --url https://ai-kit.polyms.dev/mcp, then codex mcp login aikit. In VS Code, use MCP: Add Server with the same HTTP URL and complete OAuth. This ai-kit checkout already includes both project configurations.'

