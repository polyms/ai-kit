intelligence_title: "The right skill. Only what you need."
intelligence_intro: "For AI chat tools and other compatible MCP clients: the read-only skill provider guides discovery, selective retrieval and optional handoffs. Development tools can also use the same local skill files."
intelligence_discovery_title: "Smart discovery"
intelligence_discovery_body: "Intent, boundaries and suggested starter paths guide the client toward a minimal set of skills. Simple requests can skip skills entirely."
intelligence_loading_title: "Progressive loading"
intelligence_loading_body: "Read the entry workflow first. Retrieve templates and references by exact path only when needed; reuse content already in the session."
intelligence_composition_title: "Skill composition"
intelligence_composition_body: "Input/output contracts, shared context and completion gates guide optional handoffs. The client stops blocked work instead of inventing decisions."
intelligence_loading_example: "Entry first, references later"
intelligence_loading_explain: "Example: discover the design pack, then fetch only the advertised entry file."
intelligence_loading_note: "Other files remain manifest metadata until requested."
intelligence_eval_title: "Built to be evaluated"
intelligence_eval_body: "The evaluation checks whether assisted outputs preserve requirements, select relevant skills and hand off work correctly. It compares against an unassisted baseline under matched conditions."
intelligence_packs: "MCP skill packs"
intelligence_recipes: "workflow recipes"
intelligence_eval_note: "68 synthetic scenarios cover output quality, routing and composition. Comparative model quality and native-client results are not yet established."
intelligence_workflows_title: "Workflow recipes"
intelligence_workflows_intro: "Start at the first missing artifact. These are suggested routes, not mandatory pipelines."
intelligence_workflows_note: "Skip irrelevant stages, preserve approved scope and require explicit authorization for external writes. No server-side orchestration."
