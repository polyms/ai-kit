principles_2_body: Short-named skills (/pm, /design, /dev) you combine per task — no heavyweight process.
principles_2_title: Small and composable
principles_3_body: /dev encodes TDD, types, and debugging discipline — fast signal, not blind codegen.
principles_3_title: Feedback loops
