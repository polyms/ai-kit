# --- SDK integration ---
nav_sdk: "SDK"
sdk_hero_path: "For Business MCP developers · versioned skill delivery and local caching"
sdk_title: "Bring AI Kit to your own MCP."
sdk_intro: "Use the same requirements, planning and review methodology inside your business server. Your MCP owns domain context and operations; AI Kit supplies reusable skill instructions."
sdk_release_note: "Install the latest SDK package. Skill releases update independently; the SDK resolves the latest skill version by default."
sdk_feature_static: "Versioned static bundles"
sdk_feature_static_body: "Pinned Git content is verified and bundled at build time. No GitHub fetch is needed on the provider request path."
sdk_feature_cache: "Load once, reuse"
sdk_feature_cache_body: "A process-local cache, concurrent request coalescing and optional preload avoid repeated network requests for cached content."
sdk_feature_extend: "Domain extensions"
sdk_feature_extend_body: "Add trusted local business rules to core methodology without copying or overriding the core skill. Your MCP validates all writes."
sdk_architecture: "Pinned starter content takes one static request on a cold SDK cache; a warm cache hit requires no network call."
sdk_install_title: "Install SDK"
sdk_install_body: "Node.js 22 or newer. Install through the Polyms npm registry. No authentication token is required."
sdk_setup_title: "Initialize once per process"
sdk_setup_body: "Keep the provider outside individual tool handlers. Preload frequently used skills only when useful; handle network failures before returning a workflow."
sdk_usage_title: "Use skills in your MCP"
sdk_reference_body: "Starter mode returns the entry workflow and shared standard where applicable. Load additional reference files by exact manifest path when needed."
sdk_methods_title: "SDK methods"
sdk_method_list: "Discover a versioned catalog."
sdk_method_get: "Load starter, full, manifest or selected paths."
sdk_method_preload: "Warm selected starter bundles."
sdk_method_clear: "Clear cached catalogs and content."
sdk_http_title: "HTTP API"
sdk_http_body: "Use the static JSON endpoints without the TypeScript SDK; use the read-only POST endpoint for exact path selection."
sdk_security: "Public skill delivery requires no user credentials. Keep business data and write authorization inside your own MCP; instructions are not authorization."
sdk_performance_note: "Production latency is not yet benchmarked. The request counts describe the design, not measured response times."

