skill_audience_dev_detail: "Install locally in a supported development tool such as Cursor, Claude Code, Codex or Copilot. This skill is not in the published remote MCP work catalog."
pipeline_dev_note: "Stages are optional guidance, not an AI Kit orchestration engine. Chat users can use business workflows without checking out a repository."
intelligence_eval_method: "Compare responses to the same synthetic task, check rubric and hard gates, and record actual retrieval separately from output quality. No uplift is claimed before independent comparison."
quickstart_choose: "Choose how you work."
