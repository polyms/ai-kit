<svg fill="none" height="900" width="1500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern height="30" id="dots" patternUnits="userSpaceOnUse" width="30">
      <circle cx="15" cy="15" fill="#94a3b8" opacity="0.45" r="1.15" />
    </pattern>
    <radialGradient cx="50%" cy="38%" id="fade" r="62%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <mask id="mask">
      <rect fill="url(#fade)" height="900" width="1500" />
    </mask>
  </defs>
  <rect fill="url(#dots)" height="900" mask="url(#mask)" width="1500" />
</svg>
